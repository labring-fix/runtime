name: containerd for k8s autobuild
on:
  workflow_dispatch:
    inputs:
      sealosPatch:
        description: 'sealos patch image for development.eg.ghcr.io/labring/sealos-patch:latest'
        required: false
      part:
        description: 'exec part.0,1,2,3,4,5,6'
        required: true
        default: 0
      allbuild:
        description: 'build all images'
        required: true
        default: false
  workflow_call:
    inputs:
      part:
        description: 'exec part.0,1,2,3,4,5,6'
        required: false
        type: string
        default: '5'
      allbuild:
        description: 'build all images'
        required: false
        type: boolean
        default: false
      sealosPatch:
        description: 'sealos patch image for development.eg.ghcr.io/labring/sealos-patch:latest'
        required: false
        type: string
        default: ''
      kubeVersion:
        description: 'single Kubernetes version to build, e.g. 1.33.6; empty means resolve from part via versions.sh'
        required: false
        type: string
        default: ''
      sealosVersion:
        description: 'Sealos version, e.g. 5.1.1; empty or latest means latest Sealos tag'
        required: false
        type: string
        default: 'latest'
    secrets:
      D_REGISTRY_TOKEN:
        required: false
permissions:
  contents: read
  packages: write
  issues: write
env:
  part: ${{ inputs.part }}
  allBuild: ${{ inputs.allbuild }}
  registry: ghcr.io
  repo: labring-fix  # org: image name is $registry/$repo/$IMAGE_KUBE, giving ghcr.io/labring-fix/kubernetes (2-level, same as upstream labring/kubernetes naming)
  sealosPatch: ${{ inputs.sealosPatch }}
  criType: containerd
  kubeVersion: ${{ inputs.kubeVersion }}
  sealosVersion: ${{ inputs.sealosVersion }}
jobs:
  resolve-issue-sealoslatest:
    runs-on: ubuntu-24.04
    outputs:
      sealoslatest: ${{ steps.set-sealoslatest.outputs.sealoslatest }}
    steps:
