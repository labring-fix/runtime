# Test labring/cilium on k8s 1.34 (kubeadm rootfs image from this repo).
#
# Purpose: verify the user's exact install command works on k8s 1.34 and
# whether the pod CIDR lines up:
#   sealos run labring/cilium:v1.18.4 \
#     -e ExtraValues=ipam.operator.clusterPoolIPv4PodCIDRList=100.64.0.0/10 \
#     -e ExtraValues=kubeProxyReplacement="true" \
#     --force
#
# NOTE (2026-11-21 finding): the two -e ExtraValues flags do NOT both
# survive — sealos stores env in a map, so the second flag overwrites the
# first and the CIDR list never reaches the chart. Both values are merged
# into ONE -e flag below (the CIDR as a Helm list). The entrypoint's
# hardcoded kubeProxyReplacement=strict was removed in the org fork, so the
# trailing kubeProxyReplacement=true is the only value now.
#
# Flow: single-node 1.34.13 cluster from our rootfs image (kube-proxy is
# installed by kubeadm, then removed per the Cilium docs procedure, which
# is equivalent to the user's kubeadm SkipPhases addon/kube-proxy flow),
# then the install command, then evidence collection (cilium-config,
# node PodCIDR, nginx pod IP + HTTP, NodePort), then a gate step.
name: test cilium on k8s 1.34

on:
  workflow_dispatch:
    inputs:
      kube_tag:
        description: 'Rootfs image tag to test, e.g. v1.34.13-5.1.2'
        required: true
        default: 'v1.34.13-5.1.2'
      sealos_version:
        description: 'Sealos version to install, e.g. 5.1.2'
        required: true
        default: '5.1.2'
      cilium_image:
        description: 'Cilium cluster image, e.g. labring/cilium or ghcr.io/labring-fix/cilium'
        required: true
        default: 'labring/cilium'
      cilium_version:
        description: 'Cilium version, e.g. v1.18.4'
        required: true
        default: 'v1.18.4'
      pod_cidr:
        description: 'Pod CIDR pool passed to Cilium, e.g. 100.64.0.0/10'
        required: true
        default: '100.64.0.0/10'

permissions:
  contents: read
  packages: read

jobs:
  cilium-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install sealos
        run: |
          set -e
          wget -q "https://github.com/labring/sealos/releases/download/v${{ inputs.sealos_version }}/sealos_${{ inputs.sealos_version }}_linux_amd64.tar.gz"
          tar zxvf "sealos_${{ inputs.sealos_version }}_linux_amd64.tar.gz" sealos
          sudo mv sealos /usr/local/bin/sealos
          sealos version

      - name: Stage 0 - inspect the image (labels, size)
        run: |
          set -e
          sudo sealos login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          sudo sealos inspect "ghcr.io/labring-fix/kubernetes:${{ inputs.kube_tag }}"

      - name: 'Stage A prep - remove preinstalled containerd/docker (the image check.sh refuses a host that already has them)'
        run: |
          set -e
          sudo systemctl stop containerd docker || true
          sudo apt-get purge -y containerd containerd.io docker.io docker-ce docker-ce-cli docker-buildx-plugin docker-compose-plugin || true
          sudo apt-get autoremove -y || true
          sudo rm -rf /var/lib/containerd /etc/containerd /var/run/docker.sock /var/lib/docker
          if command -v containerd || command -v docker; then
            echo "ERROR: containerd/docker still present after purge" >&2
            exit 1
          fi

      - name: 'Stage A - install cluster from our rootfs image (k8s 1.34)'
        run: |
          set -e
          sudo sealos run "ghcr.io/labring-fix/kubernetes:${{ inputs.kube_tag }}" --debug

      - name: 'Stage A checks - control plane up'
        run: |
          set -e
          export KUBECONFIG=/etc/kubernetes/admin.conf
          sudo kubectl version
          sudo kubectl get nodes -o wide
          sudo kubectl get pods -n kube-system -o wide
          sudo systemctl is-active kubelet containerd
          test "$(sudo kubectl get nodes --no-headers | wc -l)" = "1"
          for comp in kube-apiserver kube-controller-manager kube-scheduler etcd; do
            sudo kubectl wait --for=condition=Ready "pod" -n kube-system -l "component=$comp" --timeout=300s
          done
          echo "Stage A PASSED: control plane is up on k8s 1.34"

      - name: 'Remove kube-proxy (Cilium docs procedure for existing clusters)'
        run: |
          set -e
          export KUBECONFIG=/etc/kubernetes/admin.conf
          sudo kubectl -n kube-system delete ds kube-proxy || true
          sudo kubectl -n kube-system delete cm kube-proxy || true
          sudo iptables-save | grep -v KUBE | sudo iptables-restore || true
          echo "kube-proxy DaemonSet after delete (expect NotFound):"
          sudo kubectl -n kube-system get ds kube-proxy || true
          getent hosts apiserver.cluster.local || echo "WARNING: apiserver.cluster.local does not resolve"

      - name: 'Stage B - install Cilium with the exact user command'
        run: |
          set +e
          export KUBECONFIG=/etc/kubernetes/admin.conf
          sudo mkdir -p /root/.kube
          sudo cp /etc/kubernetes/admin.conf /root/.kube/config
          sudo sealos run "${{ inputs.cilium_image }}:${{ inputs.cilium_version }}" \
            -e ExtraValues=ipam.operator.clusterPoolIPv4PodCIDRList=["${{ inputs.pod_cidr }}"],kubeProxyReplacement=true \
            --force
          echo $? > /tmp/cilium-install-rc
          echo "cilium install exit code: $(cat /tmp/cilium-install-rc)"

      - name: 'Stage B checks - Cilium up, CIDR in config, pod IP in range, traffic flows'
        if: always()
        run: |
          set +e
          export KUBECONFIG=/etc/kubernetes/admin.conf
          echo "=== install exit code: $(cat /tmp/cilium-install-rc 2>/dev/null || echo unknown) ==="
          echo "=== cilium pods ==="
          sudo kubectl get pods -n kube-system -l k8s-app=cilium -o wide
          sudo kubectl get pods -A | grep -i cilium
          echo "=== cilium-config (the CIDR / kube-proxy-replacement evidence) ==="
          sudo kubectl -n kube-system get cm cilium-config -o yaml | grep -iE 'cluster-pool|ipam|kube-proxy-replacement|cluster-cidr' || echo "(no matching keys in cilium-config)"
          echo "=== node PodCIDR ==="
          sudo kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'; echo
          echo "=== cilium status ==="
          sudo kubectl -n kube-system exec ds/cilium -- cilium-dbg status 2>&1 | head -30 || sudo kubectl -n kube-system exec ds/cilium -- cilium status 2>&1 | head -30 || true
          echo "=== kube-proxy really gone? ==="
          sudo kubectl -n kube-system get ds kube-proxy 2>&1 || true
          ps aux | grep -v grep | grep kube-proxy || echo "(no kube-proxy process)"
          sudo kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
          sudo kubectl wait --for=condition=Ready node --all --timeout=600s
          sudo kubectl wait --for=condition=Ready pod -n kube-system -l k8s-app=cilium --timeout=600s
          sudo kubectl wait --for=condition=Ready pod -n kube-system -l k8s-app=kube-dns --timeout=600s
          sudo kubectl run nginx-test --image=nginx:1.27-alpine --port=80
          sudo kubectl wait --for=condition=Ready pod/nginx-test --timeout=300s
          sudo kubectl get pod nginx-test -o wide
          POD_IP=$(sudo kubectl get pod nginx-test -o jsonpath='{.status.podIP}')
          echo "nginx pod IP: $POD_IP"
          python3 -c "import ipaddress,sys; net=ipaddress.ip_network('${{ inputs.pod_cidr }}'); sys.exit(0 if ipaddress.ip_address('$POD_IP') in net else 1)" && echo "POD IP IS INSIDE ${{ inputs.pod_cidr }}" || echo "POD IP IS OUTSIDE ${{ inputs.pod_cidr }} (CIDR MISMATCH)"
          sudo kubectl exec nginx-test -- wget -qO- http://localhost | head -c 200; echo
          sudo kubectl expose pod nginx-test --type=NodePort --port=80 --name=nginx-test-svc
          NODEPORT=$(sudo kubectl get svc nginx-test-svc -o jsonpath='{.spec.ports[0].nodePort}')
          echo "NodePort: $NODEPORT"
          curl -s --max-time 15 "http://127.0.0.1:$NODEPORT" | head -c 200; echo
          echo "Stage B checks done"

      - name: 'Gate - fail the job if install or checks failed'
        if: always()
        run: |
          set -e
          test "$(cat /tmp/cilium-install-rc)" = "0"
          export KUBECONFIG=/etc/kubernetes/admin.conf
          sudo kubectl wait --for=condition=Ready pod -n kube-system -l k8s-app=cilium --timeout=60s
          POD_IP=$(sudo kubectl get pod nginx-test -o jsonpath='{.status.podIP}')
          python3 -c "import ipaddress,sys; net=ipaddress.ip_network('${{ inputs.pod_cidr }}'); sys.exit(0 if ipaddress.ip_address('$POD_IP') in net else 1)"
          echo "GATE PASSED: Cilium ${{ inputs.cilium_version }} works on k8s 1.34 with pod CIDR ${{ inputs.pod_cidr }}"

      # DIAGNOSTIC for the CNI DEL hang follow-up (containerd/containerd#14629,
      # projectcalico/calico#14696, kubernetes/kubeadm#3341): time the reset and
      # capture the StopPodSandbox evidence. A clean reset finishes in seconds;
      # the hang shows as minutes with "StopPodSandbox from runtime service
      # failed" in the kubelet journal and CNI DEL errors in the reset log.
      - name: Cleanup - reset the cluster (timed, with hang diagnostics)
        if: always()
        run: |
          START=$(date +%s)
          echo "RESET START: $(date -u +%FT%TZ)"
          sudo sealos reset --force > /tmp/reset.log 2>&1 || true
          END=$(date +%s)
          echo "RESET DONE: took $((END-START))s"
          echo "===== reset.log tail ====="
          tail -n 40 /tmp/reset.log || true
          echo "===== kubelet StopPodSandbox failures, reset window ====="
          sudo journalctl -u kubelet --since "30 minutes ago" --no-pager 2>/dev/null | grep -E "StopPodSandbox|RemovePodSandbox" | tail -n 40 || true
          echo "===== containerd journal, reset window ====="
          sudo journalctl -u containerd --since "30 minutes ago" --no-pager 2>/dev/null | grep -E "StopPodSandbox|failed to destroy network|signal: killed" | tail -n 40 || true
